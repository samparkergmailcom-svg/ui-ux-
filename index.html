<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101b3b">
<title>ShoeStyle | Shop Sneakers</title>
<style>
:root{--navy:#101b3b;--yellow:#ffd84d;--red:#ef3340;--bg:#f7f8fc;--muted:#7c8498}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--navy)}
button,input{font:inherit}button{cursor:pointer;border:0}
header{background:white;position:sticky;top:0;z-index:4;border-bottom:1px solid #e9ecf3}
.nav{max-width:1150px;margin:auto;padding:16px 22px;display:flex;align-items:center;gap:20px}
.logo{font-size:27px;font-weight:900;color:var(--navy);text-decoration:none;white-space:nowrap}.logo span{color:var(--red)}
.search{display:flex;align-items:center;gap:10px;background:#f3f5fa;border-radius:14px;padding:12px 16px;flex:1}.search input{border:0;outline:0;background:transparent;width:100%}
.navbtn{padding:11px 15px;border-radius:12px;background:#edf0f8;color:var(--navy);font-weight:700}.navbtn.primary{background:var(--navy);color:white}
main{max-width:1150px;margin:auto;padding:24px 22px 100px}
.hero{background:linear-gradient(110deg,#101b3b 0%,#1b2c58 65%,#ffd84d 65%);border-radius:24px;color:white;padding:38px;display:flex;align-items:center;justify-content:space-between;gap:20px;overflow:hidden}
.eyebrow{color:var(--yellow);font-weight:800;text-transform:uppercase;letter-spacing:2px;font-size:13px}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.03;margin:12px 0;letter-spacing:-2px}.hero p{color:#d6dbea;max-width:430px;line-height:1.6}
.shop{background:var(--yellow);color:var(--navy);padding:13px 20px;border-radius:12px;font-weight:900;margin-top:10px}.hero-shoe{font-size:clamp(90px,16vw,175px);transform:rotate(-20deg);filter:drop-shadow(0 18px 15px #0005);padding-right:20px}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:30px 0 18px}.section-title h2{font-size:27px;margin:0}.section-title p{margin:6px 0 0;color:var(--muted);font-size:14px}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:white;border:1px solid #e9ecf3;border-radius:19px;padding:13px;box-shadow:0 5px 16px #101b3b08}
.product-art{height:160px;border-radius:14px;display:grid;place-items:center;font-size:85px;position:relative;background:#f0f2f9}
.discount{position:absolute;top:10px;right:10px;background:var(--red);color:white;font-weight:800;font-size:12px;padding:6px 9px;border-radius:20px}
.card h3{font-size:16px;margin:13px 0 5px}.type{color:var(--muted);font-size:13px}
.price-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}.price{font-weight:900;font-size:18px}.old{font-size:12px;color:var(--muted);text-decoration:line-through;margin-left:5px}
.add{width:38px;height:38px;border-radius:12px;background:var(--yellow);color:var(--navy);font-size:24px;font-weight:800}
.profile{display:none;background:white;padding:16px 20px;border-radius:16px;margin:18px 0;border:1px solid #e9ecf3;align-items:center;justify-content:space-between}.profile.show{display:flex}.profile p{margin:5px 0 0;color:var(--muted);font-size:13px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid #e9ecf3;display:flex;justify-content:center;gap:clamp(16px,6vw,65px);padding:12px 10px;z-index:5}.bottom button{background:none;color:var(--navy);font-weight:700;font-size:12px}.bottom b{display:block;font-size:22px;margin-bottom:3px}
.modal{position:fixed;inset:0;background:#101b3bcc;display:none;place-items:center;padding:20px;z-index:10}.modal.show{display:grid}.modal-box{background:white;padding:26px;border-radius:20px;width:min(100%,360px)}.modal-box input{display:block;width:100%;padding:13px;margin:10px 0;border:1px solid #e1e5ee;border-radius:10px}.modal-box button{width:100%;margin-top:8px}.close{float:right;width:auto!important;background:#eef0f6;padding:6px 10px;border-radius:8px}
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:12px 18px;border-radius:12px;display:none;z-index:8}.toast.show{display:block}
@media(max-width:850px){.nav{flex-wrap:wrap;gap:12px}.search{order:3;flex-basis:100%}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:26px}.hero-shoe{font-size:100px}}
@media(max-width:480px){main{padding:16px 12px 95px}.nav{padding:12px}.logo{font-size:24px}.navbtn{padding:9px 11px}.hero{padding:22px;min-height:230px}.hero-shoe{font-size:70px;padding:0}.hero h1{font-size:36px}.products{gap:11px}.card{padding:9px}.product-art{height:120px;font-size:62px}.section-title h2{font-size:22px}.bottom{gap:20px}}
</style>
</head>
<body>
<header><nav class="nav">
<a class="logo" href="#">Shoe<span>Style</span></a>
<label class="search">⌕ <input id="search" type="search" placeholder="Search shoes..." aria-label="Search shoes"></label>
<button class="navbtn" id="profileBtn">Profile</button><button class="navbtn primary" id="loginBtn">Login</button>
</nav></header>
<main>
<section class="hero">
<div><div class="eyebrow">New arrival</div><h1>Walk in<br>Style.</h1><p>Find your perfect pair. Fresh sneakers and everyday comfort, all in one place.</p><button class="shop" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Shop Now →</button></div>
<div class="hero-shoe" aria-hidden="true">👟</div>
</section>
<section class="profile" id="profile"><div><strong id="profileName">Guest profile</strong><p id="profileEmail">Sign in to view your profile.</p></div><button class="navbtn" id="logoutBtn">Logout</button></section>
<div class="section-title" id="products"><div><h2>Popular Products</h2><p>Four favorites picked for you</p></div><span id="count">4 products</span></div>
<section class="products" id="productList"></section>
</main>
<nav class="bottom"><button onclick="window.scrollTo({top:0,behavior:'smooth'})"><b>⌂</b>Home</button><button onclick="document.getElementById('search').focus()"><b>⌕</b>Search</button><button onclick="showToast('Your cart has '+cart+' item(s)')"><b>🛒</b>Cart</button><button id="bottomProfile"><b>♙</b>Profile</button><button id="bottomLogout"><b>⇥</b>Logout</button></nav>
<div class="modal" id="loginModal"><div class="modal-box"><button class="close" id="closeModal">✕</button><h2>Welcome to ShoeStyle</h2><p class="type">Enter your details for this demo profile.</p><form id="loginForm"><input id="name" placeholder="Your name" required><input id="email" type="email" placeholder="Email address" required><button class="navbtn primary" type="submit">Login</button></form></div></div>
<div class="toast" id="toast"></div>
<script>
const products=[
{name:'Air Force Classic',type:'Casual sneakers',price:6999,old:9999,discount:'-30%',emoji:'👟',bg:'#f0f2fb'},
{name:'Street Superstar',type:'Streetwear',price:5999,old:7999,discount:'-25%',emoji:'🥾',bg:'#f4f1ed'},
{name:'Puma Sport Runner',type:'Running shoes',price:4799,old:5999,discount:'-20%',emoji:'👟',bg:'#fff0f0'},
{name:'Go Walk Comfort',type:'Walking shoes',price:5499,old:6499,discount:'-15%',emoji:'👞',bg:'#eef3fc'}
];
const list=document.getElementById('productList'),search=document.getElementById('search'),count=document.getElementById('count');
let cart=0;
function render(){const q=search.value.toLowerCase().trim(),items=products.filter(p=>(p.name+' '+p.type).toLowerCase().includes(q));count.textContent=items.length+' products';list.innerHTML=items.length?items.map((p,i)=>'<article class="card"><div class="product-art" style="background:'+p.bg+'"><span class="discount">'+p.discount+'</span>'+p.emoji+'</div><h3>'+p.name+'</h3><div class="type">'+p.type+'</div><div class="price-row"><div><span class="price">₹'+p.price.toLocaleString('en-IN')+'</span><span class="old">₹'+p.old.toLocaleString('en-IN')+'</span></div><button class="add" onclick="addToCart('+i+')" aria-label="Add to cart">+</button></div></article>').join(''):'<p>No products found. Try another search.</p>'}
function addToCart(i){cart++;showToast(products[i].name+' added to cart · '+cart+' item(s)')}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
search.addEventListener('input',render);render();
const modal=document.getElementById('loginModal'),profile=document.getElementById('profile');
function openLogin(){modal.classList.add('show')}function toggleProfile(){profile.classList.toggle('show')}
document.getElementById('loginBtn').onclick=openLogin;document.getElementById('profileBtn').onclick=toggleProfile;document.getElementById('bottomProfile').onclick=toggleProfile;document.getElementById('bottomLogout').onclick=logout;document.getElementById('closeModal').onclick=()=>modal.classList.remove('show');
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('profileName').textContent=document.getElementById('name').value;document.getElementById('profileEmail').textContent=document.getElementById('email').value;document.getElementById('loginBtn').textContent='Account';profile.classList.add('show');modal.classList.remove('show');showToast('Welcome to ShoeStyle!')});
function logout(){document.getElementById('profileName').textContent='Guest profile';document.getElementById('profileEmail').textContent='Sign in to view your profile.';document.getElementById('loginBtn').textContent='Login';profile.classList.remove('show');showToast('Logged out')}
document.getElementById('logoutBtn').onclick=logout;modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
</script>
</body>
</html>
